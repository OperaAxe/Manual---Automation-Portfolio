<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Manual QA to Automation</title>
  <desc id="desc">A colorful illustrated banner with a test checklist, browser window, bug character, and green quality shield.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1224"/>
      <stop offset="55%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <circle cx="1078" cy="55" r="118" fill="#38bdf8" opacity=".08"/>
  <circle cx="945" cy="305" r="150" fill="#a78bfa" opacity=".12"/>
  <path d="M0 270 C200 225 330 345 530 286 S880 232 1200 280 L1200 330 L0 330Z" fill="#0f172a" opacity=".7"/>
  <g opacity=".6" stroke-linecap="round" stroke-width="4" fill="none">
    <path d="M48 53 l13 -13 M65 64 l14 -14 M82 74 l13 -13" stroke="#22d3ee"/>
    <path d="M1081 235 l11 -14 M1099 245 l11 -14 M1117 255 l11 -14" stroke="#fbbf24"/>
    <path d="M555 43 l8 -18 M577 47 l4 -18 M596 53 l2 -17" stroke="#fb7185"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="54" y="105" font-size="19" font-weight="700" letter-spacing="3" fill="#67e8f9">QA PORTFOLIO</text>
    <text x="52" y="165" font-size="48" font-weight="800" fill="#ffffff">Manual QA</text>
    <text x="52" y="222" font-size="48" font-weight="800" fill="#a78bfa">→ Automation</text>
    <text x="56" y="262" font-size="18" fill="#cbd5e1">Test the flow. Find the risk. Prove the result.</text>
    <rect x="54" y="282" width="139" height="28" rx="14" fill="#0f766e" stroke="#5eead4"/>
    <text x="123" y="301" font-size="12" font-weight="700" text-anchor="middle" fill="#f0fdfa">MANUAL TESTING</text>
    <rect x="204" y="282" width="148" height="28" rx="14" fill="#6d28d9" stroke="#c4b5fd"/>
    <text x="278" y="301" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">PLAYWRIGHT</text>
  </g>
  <g transform="translate(442 77) rotate(-7 84 77)" filter="url(#shadow)">
    <rect x="0" y="0" width="155" height="174" rx="15" fill="url(#card)" stroke="#bae6fd" stroke-width="3"/>
    <rect x="0" y="0" width="155" height="33" rx="15" fill="#2563eb"/>
    <rect x="0" y="20" width="155" height="13" fill="#2563eb"/>
    <circle cx="18" cy="16" r="4" fill="#fb7185"/>
    <circle cx="32" cy="16" r="4" fill="#fbbf24"/>
    <circle cx="46" cy="16" r="4" fill="#34d399"/>
    <text x="17" y="58" font-size="11" font-weight="800" fill="#1e293b">TEST CHECKLIST</text>
    <g stroke="#cbd5e1" stroke-width="1.5">
      <rect x="16" y="70" width="16" height="16" rx="4" fill="#d1fae5" stroke="#059669"/>
      <path d="M20 78 l4 4 l7 -9" fill="none" stroke="#059669" stroke-width="2.5"/>
      <line x1="42" y1="78" x2="134" y2="78"/>
      <rect x="16" y="96" width="16" height="16" rx="4" fill="#d1fae5" stroke="#059669"/>
      <path d="M20 104 l4 4 l7 -9" fill="none" stroke="#059669" stroke-width="2.5"/>
      <line x1="42" y1="104" x2="126" y2="104"/>
      <rect x="16" y="122" width="16" height="16" rx="4" fill="#fff7ed" stroke="#f97316"/>
      <line x1="42" y1="130" x2="117" y2="130"/>
      <rect x="16" y="146" width="16" height="16" rx="4" fill="#fee2e2" stroke="#ef4444"/>
      <line x1="42" y1="154" x2="103" y2="154"/>
    </g>
  </g>
  <g transform="translate(655 74)" filter="url(#shadow)">
    <rect x="0" y="20" width="210" height="147" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <rect x="0" y="20" width="210" height="28" rx="12" fill="#1e293b"/>
    <rect x="0" y="38" width="210" height="10" fill="#1e293b"/>
    <circle cx="18" cy="34" r="4" fill="#fb7185"/>
    <circle cx="32" cy="34" r="4" fill="#fbbf24"/>
    <circle cx="46" cy="34" r="4" fill="#34d399"/>
    <text x="16" y="70" font-family="Consolas, monospace" font-size="11" fill="#67e8f9">test('cart stays correct')</text>
    <text x="16" y="95" font-family="Consolas, monospace" font-size="11" fill="#c4b5fd">await page.click(...)</text>
    <text x="16" y="120" font-family="Consolas, monospace" font-size="11" fill="#a7f3d0">expect(cart).toHaveCount(1)</text>
    <rect x="151" y="130" width="42" height="26" rx="7" fill="url(#green)"/>
    <path d="M160 143 l7 6 l12 -14" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(924 95)" filter="url(#shadow)">
    <path d="M50 4 C38 4 32 -3 19 1 C21 19 14 28 4 36 C4 75 24 99 50 109 C76 99 96 75 96 36 C86 28 79 19 81 1 C68 -3 62 4 50 4Z" fill="url(#green)" stroke="#a7f3d0" stroke-width="3"/>
    <path d="M27 52 l15 16 l31 -35" fill="none" stroke="#064e3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 16 l-8 -14 M82 16 l8 -14" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(1053 90)" filter="url(#shadow)">
    <circle cx="42" cy="40" r="34" fill="#fb7185" stroke="#fecdd3" stroke-width="3"/>
    <ellipse cx="42" cy="40" rx="12" ry="28" fill="#881337"/>
    <circle cx="31" cy="29" r="6" fill="#ffffff"/><circle cx="53" cy="29" r="6" fill="#ffffff"/>
    <circle cx="31" cy="29" r="2.5" fill="#111827"/><circle cx="53" cy="29" r="2.5" fill="#111827"/>
    <g stroke="#fecdd3" stroke-width="4" stroke-linecap="round">
      <path d="M10 25 l-17 -8 M8 42 l-18 0 M14 60 l-15 12 M74 25 l17 -8 M76 42 l18 0 M70 60 l15 12"/>
    </g>
    <path d="M34 7 l-6 -14 M50 7 l8 -14" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(1056 224)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="100" height="36" rx="18" fill="#fbbf24"/>
    <text x="50" y="23" text-anchor="middle" font-size="12" font-weight="800" fill="#422006">BUG HUNT</text>
  </g>
</svg>